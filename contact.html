<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | 株式会社ロクワン</title>
<style>
  body { margin:0; font-family:sans-serif; background:#0a0a0a; color:#fff; line-height:1.8; text-align:center; padding: 50px 20px; }
  .form-container { max-width: 600px; margin: 0 auto; text-align: left; background: #111; padding: 40px 30px; border-radius: 8px; border: 1px solid #333; }
</style>
</head>
<body>
  <h2 style="letter-spacing: 0.1em;">CONTACT</h2>
  <p style="margin-bottom: 40px;">以下のフォームにご入力の上、送信してください。</p>

  <div class="form-container">
    <form action="https://formspree.io/f/xeedllzq" method="POST">
      
      <input type="hidden" name="_next" value="https://rokuwan-site.github.io/rokuwan-site/thanks.html">

      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-weight: bold;">お名前 <span style="color:#ff6b6b; font-size:12px;">必須</span></label>
        <input type="text" name="name" required style="width: 100%; padding: 12px; box-sizing: border-box; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 16px;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-weight: bold;">メールアドレス <span style="color:#ff6b6b; font-size:12px;">必須</span></label>
        <input type="email" name="email" required style="width: 100%; padding: 12px; box-sizing: border-box; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 16px;">
      </div>

      <div style="margin-bottom: 30px;">
        <label style="display: block; margin-bottom: 8px; font-weight: bold;">お問い合わせ内容 <span style="color:#ff6b6b; font-size:12px;">必須</span></label>
        <textarea name="message" rows="6" required style="width: 100%; padding: 12px; box-sizing: border-box; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 16px;"></textarea>
      </div>

      <div style="text-align: center;">
        <button type="submit" style="background-color: #ffffff; color: #000000; padding: 16px 60px; font-size: 18px; font-weight: bold; border-radius: 30px; border: none; cursor: pointer; transition: 0.3s; width: 100%;">
          送信する
        </button>
      </div>
    </form>
  </div>

  <div style="margin-top: 40px;">
    <a href="index.html" style="color: #888; text-decoration: none;">← トップページに戻る</a>
  </div>
</body>
</html>
